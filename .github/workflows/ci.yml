name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm exec expo export --platform android --output-dir /tmp/transit-mobile-dist

  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev,archive]'
      - run: ruff check .
      - run: python -m compileall -q app tests scripts
      - run: pytest -q -m 'not integration'
      - run: pip-audit

  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: transit_test
          POSTGRES_USER: transit_test
          POSTGRES_PASSWORD: transit_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit_test -d transit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8.1.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://transit_test:transit_test_password@127.0.0.1:5432/transit_test
      TEST_CACHE_URL: redis://127.0.0.1:6379/15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev,archive]'
      - run: pytest -q -m integration

  postgres-multiarch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: infra/postgres
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-long-postgres-password
      CACHE_PASSWORD: ci-only-long-valkey-password
      CLOUDFLARE_TUNNEL_TOKEN_FILE: /tmp/cloudflare-tunnel-token
    steps:
      - uses: actions/checkout@v4
      - run: printf '%s' 'ci-only-placeholder-token-not-used-by-compose-validation' > /tmp/cloudflare-tunnel-token
      - run: docker compose -f infra/docker-compose.yml config --quiet
      - run: docker compose -f infra/docker-compose.production.yml --profile edge config --quiet
      - run: docker build --tag transit-edge-ci infra/edge
      - run: docker run --rm --add-host api:127.0.0.1 transit-edge-ci nginx -t
