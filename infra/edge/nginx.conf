worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    log_format edge_json escape=json
        '{"timestamp":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"cf_ray":"$http_cf_ray"}';
    access_log /dev/stdout edge_json;

    server_tokens off;
    keepalive_timeout 15s;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 15s;

    map $http_cf_connecting_ip $edge_client_key {
        "" $binary_remote_addr;
        default $http_cf_connecting_ip;
    }

    limit_req_zone $edge_client_key zone=public_api_rate:10m rate=5r/s;
    limit_req_zone $edge_client_key zone=map_tile_rate:10m rate=10r/s;
    limit_conn_zone $edge_client_key zone=public_api_connections:10m;

    proxy_cache_path /tmp/osm_tiles
        levels=1:2
        keys_zone=osm_tiles:4m
        max_size=24m
        inactive=7d
        use_temp_path=off;
    resolver 127.0.0.11 valid=300s ipv6=off;

    upstream transit_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        client_max_body_size 16k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ~ ^/v1/map/tiles/(?<tile_z>(?:[0-9]|1[0-9]))/(?<tile_x>[0-9]+)/(?<tile_y>[0-9]+)\.png$ {
            limit_except GET {
                deny all;
            }

            limit_req zone=map_tile_rate burst=30 nodelay;
            limit_req_status 429;
            limit_conn public_api_connections 20;
            limit_conn_status 429;

            proxy_pass https://tile.openstreetmap.org/$tile_z/$tile_x/$tile_y.png;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_ssl_name tile.openstreetmap.org;
            proxy_set_header Connection "";
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header User-Agent "TransitIntelligence/0.1 (+https://github.com/M-4vlis)";
            proxy_set_header Accept "image/png,image/*;q=0.9,*/*;q=0.8";
            proxy_set_header Accept-Encoding "";
            proxy_set_header Referer "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;

            proxy_cache osm_tiles;
            proxy_cache_key "$tile_z/$tile_x/$tile_y";
            proxy_cache_lock on;
            proxy_cache_revalidate on;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_ignore_headers Set-Cookie;
            proxy_hide_header Set-Cookie;
            add_header X-Transit-Tile-Cache $upstream_cache_status always;
        }

        location /v1/ {
            limit_except GET OPTIONS {
                deny all;
            }

            if ($request_method = OPTIONS) {
                return 204;
            }

            limit_req zone=public_api_rate burst=20 nodelay;
            limit_req_status 429;
            limit_conn public_api_connections 20;
            limit_conn_status 429;

            proxy_pass http://transit_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Real-IP $edge_client_key;
            proxy_set_header X-Forwarded-For $edge_client_key;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }

        location / {
            return 404 '{"detail":"Not Found"}\n';
        }
    }

    server {
        listen 8081;
        access_log off;

        location = /edge-health {
            return 200 '{"status":"ok"}\n';
        }

        location / {
            return 404;
        }
    }
}
