[project]
name = "transit-intelligence-api"
version = "0.7.1"
description = "Mobility intelligence backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "asyncpg>=0.30,<1",
  "redis>=6,<7",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
archive = [
  "pyarrow>=21,<24",
  "boto3>=1.40,<2",
]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "pip-audit>=2.9,<3",
  "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "integration: requires real PostGIS and Valkey services",
]

[tool.ruff]
line-length = 100
